name: Build API

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build TaskManagementAPI.slnx          

      - run: dotnet test TaskManagement.Tests/TaskManagement.Tests.csproj --no-build --filter "FullyQualifiedName~TaskItemTest"